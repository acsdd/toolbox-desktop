name: Website

# Manual on purpose: the site links to the repository, so it should only go
# live once the repository is public and Pages is enabled for this repo.
# After the go-public checklist passes, add:
#   push:
#     branches: [main]
#     paths:
#       - 'website/**'
#       - 'scripts/check-site-links.cjs'
#       - 'scripts/inject-site-version.cjs'
#       - 'package.json'
#       - '.github/workflows/pages.yml'
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync site version from package.json
        run: node scripts/inject-site-version.cjs

      - name: Check landing page links
        run: node scripts/check-site-links.cjs website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
