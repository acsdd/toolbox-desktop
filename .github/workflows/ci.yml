name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The @toolbox/widgets dependency is a sibling checkout (symlinked by
      # npm), so its own runtime deps must be installed for Node to resolve
      # them from the package realpath. The main build bundles the core.
      - name: Fetch widget core
        shell: bash
        run: git clone https://github.com/acsdd/toolbox-widgets.git ../toolbox-widgets

      - name: Install widget core deps
        run: npm install --omit=dev
        working-directory: ../toolbox-widgets

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check landing page links
        run: node scripts/check-site-links.cjs website

      - name: Check site version matches package.json
        run: node scripts/inject-site-version.cjs --check
