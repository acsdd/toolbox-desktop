name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package installers
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build categorized release notes
        shell: bash
        run: node scripts/release-notes.cjs --to "$GITHUB_SHA" --out release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            dist/Toolbox-Setup-*.exe
            dist/Toolbox-Setup-*.exe.blockmap
            dist/Toolbox-Portable-*.exe
          )
          title="Toolbox ${GITHUB_REF_NAME#v}"
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$title" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$title" \
              --generate-notes
          fi
