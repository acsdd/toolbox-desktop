name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The @toolbox/widgets dependency is a sibling checkout (symlinked by
      # npm); its runtime deps must be present for the main build to resolve
      # them from the package realpath. electron-vite bundles the core into
      # out/main, so the installer stays self-contained.
      - name: Fetch widget core
        shell: bash
        run: git clone https://github.com/acsdd/toolbox-widgets.git ../toolbox-widgets

      - name: Install widget core deps
        run: npm install --omit=dev
        working-directory: ../toolbox-widgets

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # electron-builder downloads the Electron binaries itself (Electron >= 28
      # no longer ships a postinstall). Cache them between runs and retry the
      # packaging step: the download mirror intermittently answers 504.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}

      - name: Package installers
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder attempt $attempt failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep -Seconds 10
          }
          exit 1

      - name: Build categorized release notes
        shell: bash
        run: node scripts/release-notes.cjs --to "$GITHUB_SHA" --out release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            dist/Toolbox-Setup-*.exe
            dist/Toolbox-Setup-*.exe.blockmap
            dist/Toolbox-Portable-*.exe
          )
          title="Toolbox ${GITHUB_REF_NAME#v}"
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$title" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$title" \
              --generate-notes
          fi
