name: Feature request
description: Suggest a tool, an improvement or a workflow.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Toolbox to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other apps, scripts or workarounds.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Fit with Toolbox
      options:
        - label: This can work locally, without an account or a backend service.
        - label: This does not require telemetry or silent background uploads.
